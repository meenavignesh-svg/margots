<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8fbff"><meta name="description" content="Margots unified AI bioinformatics workspace">
<title>Margots — Unified Scientific Intelligence</title>
<style>
:root{--bg:#f7fbff;--card:rgba(255,255,255,.78);--ink:#10233b;--muted:#6b7f95;--line:#d9eaf4;--cyan:#0891b2;--blue:#2563eb;--soft:#eef9ff;--shadow:0 18px 60px rgba(31,78,121,.12)}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink);background:radial-gradient(circle at 50% 5%,#dff7ff 0,transparent 30%),linear-gradient(180deg,#fbfdff,#f3f8fc);overflow:hidden}
button,input,textarea{font:inherit}button{cursor:pointer}.app{height:100%;display:flex;flex-direction:column;position:relative}.ambient{position:absolute;inset:0;pointer-events:none;overflow:hidden}.orb{position:absolute;border-radius:50%;filter:blur(1px);opacity:.5}.o1{width:320px;height:320px;right:-80px;top:80px;background:radial-gradient(circle,#67e8f9,transparent 68%)}.o2{width:260px;height:260px;left:-80px;bottom:80px;background:radial-gradient(circle,#bfdbfe,transparent 68%)}
.top{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid rgba(148,163,184,.18);background:rgba(255,255,255,.7);backdrop-filter:blur(22px);z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:.13em}.logo{width:30px;height:30px;border-radius:10px;background:radial-gradient(circle at 30% 25%,#fff,#67e8f9 28%,#0ea5e9 70%);box-shadow:0 8px 22px rgba(14,165,233,.3)}.status{font:700 11px ui-monospace,monospace;color:#0891b2}.actions{display:flex;gap:7px}.icon{border:1px solid var(--line);background:rgba(255,255,255,.72);color:#35617d;border-radius:12px;padding:8px 10px}.icon:hover{border-color:#7dd3fc;background:#fff}
.main{width:min(920px,100%);margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;position:relative;z-index:2}.chat{flex:1;overflow:auto;padding:24px 16px 145px;scroll-behavior:smooth}.welcome{text-align:center;padding:9vh 12px 28px}.core{width:104px;height:104px;margin:0 auto 22px;border-radius:50%;background:radial-gradient(circle at 30% 22%,#fff 0 12%,#a5f3fc 25%,#38bdf8 52%,#2563eb 100%);box-shadow:0 18px 40px rgba(37,99,235,.2),0 0 75px rgba(34,211,238,.22);animation:float 4s ease-in-out infinite;position:relative}.core:before,.core:after{content:"";position:absolute;inset:-15px;border:1px solid rgba(14,165,233,.25);border-radius:50%;transform:rotateX(65deg);animation:spin 8s linear infinite}.core:after{inset:-27px;animation-duration:13s;animation-direction:reverse;border-style:dashed}.welcome h1{font-size:clamp(30px,6vw,54px);letter-spacing:-.055em;margin:0}.welcome p{color:var(--muted);margin:10px auto;max-width:620px}.suggest{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px}.chip{border:1px solid var(--line);background:rgba(255,255,255,.75);color:#42647d;border-radius:999px;padding:8px 12px}.chip:hover{border-color:#7dd3fc;background:#fff}
.msg{display:flex;margin:13px 0}.msg.user{justify-content:flex-end}.bubble{max-width:min(760px,90%);padding:14px 16px;border-radius:19px;line-height:1.55;box-shadow:0 8px 26px rgba(15,23,42,.06);white-space:pre-wrap;word-break:break-word}.user .bubble{background:linear-gradient(135deg,#e0f7ff,#e8efff);border:1px solid #bae6fd}.assistant .bubble{background:rgba(255,255,255,.82);border:1px solid rgba(148,163,184,.22)}.who{display:block;color:#0891b2;font:800 10px ui-monospace,monospace;letter-spacing:.1em;margin-bottom:5px}.source{display:inline-block;margin:10px 8px 0 0;color:#0369a1;text-decoration:none;font-size:12px}.source:hover{text-decoration:underline}.facts{margin-top:10px;background:#f7fbff;border:1px solid var(--line);border-radius:12px;padding:10px;font:12px ui-monospace,monospace;overflow:auto;max-height:240px}
.composer-wrap{position:absolute;left:14px;right:14px;bottom:18px;z-index:4}.composer{display:flex;gap:7px;align-items:flex-end;padding:8px;border:1px solid rgba(125,211,252,.45);background:rgba(255,255,255,.86);backdrop-filter:blur(22px);border-radius:24px;box-shadow:var(--shadow)}textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--ink);padding:11px 10px;min-height:46px;max-height:150px}.send,.attach,.mic{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:#f0f9ff;color:#0369a1}.send{border:0;background:linear-gradient(135deg,#06b6d4,#2563eb);color:white}.hint{text-align:center;color:#94a3b8;font-size:11px;margin-top:7px}
.drawer{position:fixed;inset:0;background:rgba(15,23,42,.25);backdrop-filter:blur(4px);z-index:20;display:none}.drawer.open{display:flex;align-items:flex-end;justify-content:center}.panel{width:min(700px,100%);max-height:82vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px;box-shadow:0 -20px 70px rgba(15,23,42,.2)}.panel h2{margin:0 0 6px}.panel p{color:var(--muted);font-size:13px}.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row input{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px}.primary{border:0;background:#0ea5e9;color:white;border-radius:12px;padding:10px 14px;font-weight:750}.secondary{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 14px}.filebox{border:2px dashed #bae6fd;border-radius:16px;padding:22px;text-align:center;color:var(--muted);background:#f8fcff}.filebox input{display:none}.history-item{padding:11px;border:1px solid var(--line);border-radius:12px;margin:7px 0;cursor:pointer}.history-item:hover{background:#f0f9ff}
@keyframes float{50%{transform:translateY(-8px) scale(1.02)}}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:600px){.top{padding:0 12px}.top .actions .optional{display:none}.chat{padding-left:9px;padding-right:9px}.bubble{max-width:94%}.welcome{padding-top:7vh}.composer-wrap{bottom:9px}}
</style></head>
<body><div class="app"><div class="ambient"><div class="orb o1"></div><div class="orb o2"></div></div><header class="top"><div class="brand"><div class="logo"></div><span>MARGOTS</span></div><div class="status" id="status">● READY</div><div class="actions"><button class="icon optional" id="historyBtn">History</button><button class="icon optional" id="keysBtn">API</button><button class="icon" id="clearBtn">Clear</button></div></header><main class="main"><section class="chat" id="chat"><div class="welcome" id="welcome"><div class="core"></div><h1>How can I help?</h1><p>One conversation for research, sequences, files, web search, AI analysis and everything else.</p><div class="suggest"><button class="chip">Analyze a sequence</button><button class="chip">Explain a biotech topic</button><button class="chip">Analyze a file</button></div></div></section><div class="composer-wrap"><form class="composer" id="form"><button type="button" class="attach" id="attach" title="Upload">📎</button><textarea id="input" rows="1" placeholder="Ask Margots anything…"></textarea><button type="button" class="mic" id="mic" title="Voice">🎙</button><button class="send" title="Send">➤</button></form><div class="hint">Search-first · local bioinformatics · AI reasoning · uploads · voice · history</div></div></main></div>
<div class="drawer" id="drawer"><div class="panel" id="panel"></div></div><input id="hiddenFile" type="file" hidden multiple>
<script src="unified-app.js"></script></body></html>
