<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Margots</title>
  <style>
    :root {
      --bg: #0b0d10;
      --surface: #12151a;
      --surface2: #181c23;
      --text: #eef1f5;
      --muted: #8b93a7;
      --line: #262b36;
      --accent: #4f8cff;
      --accent-dim: rgba(79, 140, 255, 0.12);
      --ok: #3ecf8e;
      --err: #ff6b6b;
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #152038 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #101820 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }
    header h1 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: -0.03em;
      font-weight: 700;
    }
    header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 18px;
      align-items: start;
    }
    @media (max-width: 920px) {
      .layout { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 600;
    }

    label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin: 0 0 6px;
    }

    input, textarea, button {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface2);
      color: var(--text);
      padding: 11px 12px;
      font: inherit;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    textarea {
      min-height: 130px;
      resize: vertical;
    }
    .field { margin-bottom: 12px; }
    .field:last-child { margin-bottom: 0; }

    .keys input {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.82rem;
    }

    .hint {
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .tab {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      padding: 9px 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.88rem;
    }
    .tab.active {
      color: var(--text);
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    #run {
      margin-top: 14px;
      background: var(--accent);
      color: #061018;
      border: none;
      font-weight: 700;
      cursor: pointer;
      padding: 12px;
    }
    #run:hover { filter: brightness(1.05); }
    #run:disabled { opacity: 0.55; cursor: not-allowed; }

    .status {
      min-height: 1.2em;
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .ok { color: var(--ok); }
    .err { color: var(--err); }

    .results {
      display: grid;
      gap: 14px;
    }

    .facts pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.82rem;
      color: #c9d1d9;
      background: #0d1015;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      max-height: 180px;
      overflow: auto;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    @media (max-width: 920px) {
      .answers { grid-template-columns: 1fr; }
    }

    .answer {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
    }
    .answer h3 {
      margin: 0 0 10px;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }
    .answer .body {
      flex: 1;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.92rem;
      color: #d7dde8;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Margots</h1>
        <p>Sequence and variant analysis with three independent model backends.</p>
      </div>
    </header>

    <div class="layout">
      <aside>
        <div class="panel" style="margin-bottom:14px">
          <h2>API keys</h2>
          <div class="field keys">
            <label>OpenAI</label>
            <input id="k_openai" type="password" placeholder="sk-..." autocomplete="off" />
          </div>
          <div class="field keys">
            <label>Anthropic</label>
            <input id="k_anthropic" type="password" placeholder="sk-ant-..." autocomplete="off" />
          </div>
          <div class="field keys">
            <label>xAI</label>
            <input id="k_xai" type="password" placeholder="xai-..." autocomplete="off" />
          </div>
          <p class="hint">Stored only in this browser (localStorage).</p>
        </div>

        <div class="panel">
          <h2>Input</h2>
          <div class="tabs">
            <button class="tab active" data-mode="sequence">Sequence</button>
            <button class="tab" data-mode="variant">Variant</button>
            <button class="tab" data-mode="free">Free</button>
          </div>

          <div id="panel_sequence">
            <div class="field">
              <label>Sequence</label>
              <textarea id="seq" placeholder="DNA, RNA, or protein"></textarea>
            </div>
            <div class="field">
              <label>Question (optional)</label>
              <input id="seq_q" placeholder="What stands out?" />
            </div>
          </div>

          <div id="panel_variant" hidden>
            <div class="field">
              <label>Variant</label>
              <textarea id="variant" placeholder="e.g. BRCA1 c.5266dupC"></textarea>
            </div>
          </div>

          <div id="panel_free" hidden>
            <div class="field">
              <label>Context</label>
              <textarea id="ctx" placeholder="Paste notes or summary"></textarea>
            </div>
            <div class="field">
              <label>Question</label>
              <input id="free_q" placeholder="What should be checked?" />
            </div>
          </div>

          <button id="run">Run analysis</button>
          <div class="status" id="status"></div>
        </div>
      </aside>

      <main class="results">
        <div class="panel facts">
          <h2>Local measurements</h2>
          <pre id="facts">No run yet.</pre>
        </div>

        <div class="answers">
          <div class="answer">
            <h3>Strict</h3>
            <div class="body" id="out_strict">—</div>
          </div>
          <div class="answer">
            <h3>Context</h3>
            <div class="body" id="out_context">—</div>
          </div>
          <div class="answer">
            <h3>Skeptic</h3>
            <div class="body" id="out_skeptic">—</div>
          </div>
        </div>
      </main>
    </div>
  </div>

<script>
const PROMPTS = {
  strict: "Stick to measurable sequence/table features. Avoid speculation. If evidence is weak, say so.",
  context: "Interpret in biological context. Mention plausible functions or patterns only when supported by the given data. Mark uncertainty.",
  skeptic: "Challenge the obvious reading. Offer alternatives and list what would falsify the main interpretation."
};

const els = {
  modeBtns: [...document.querySelectorAll('.tab')],
  panels: {
    sequence: document.getElementById('panel_sequence'),
    variant: document.getElementById('panel_variant'),
    free: document.getElementById('panel_free')
  },
  k_openai: document.getElementById('k_openai'),
  k_anthropic: document.getElementById('k_anthropic'),
  k_xai: document.getElementById('k_xai'),
  seq: document.getElementById('seq'),
  seq_q: document.getElementById('seq_q'),
  variant: document.getElementById('variant'),
  ctx: document.getElementById('ctx'),
  free_q: document.getElementById('free_q'),
  run: document.getElementById('run'),
  status: document.getElementById('status'),
  facts: document.getElementById('facts'),
  out_strict: document.getElementById('out_strict'),
  out_context: document.getElementById('out_context'),
  out_skeptic: document.getElementById('out_skeptic')
};

let mode = 'sequence';

['openai','anthropic','xai'].forEach(k => {
  const v = localStorage.getItem('margots_' + k);
  if (v) els['k_' + k].value = v;
});
['k_openai','k_anthropic','k_xai'].forEach(id => {
  els[id].addEventListener('change', () => {
    localStorage.setItem('margots_' + id.replace('k_', ''), els[id].value.trim());
  });
});

els.modeBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    mode = btn.dataset.mode;
    els.modeBtns.forEach(b => b.classList.toggle('active', b === btn));
    Object.entries(els.panels).forEach(([m, el]) => { el.hidden = m !== mode; });
  });
});

function cleanSeq(s) {
  return s.replace(/\s+/g, '').toUpperCase();
}

function seqFacts(raw) {
  const s = cleanSeq(raw);
  if (!s) return { error: 'empty sequence' };
  let kind = 'protein';
  if (/^[ACGTN]+$/.test(s)) kind = 'dna';
  else if (/^[ACGU]+$/.test(s)) kind = 'rna';

  const facts = {
    kind,
    length: s.length,
    preview: s.slice(0, 180) + (s.length > 180 ? '...' : '')
  };

  if (kind === 'dna' || kind === 'rna') {
    const bases = {};
    for (const ch of s) bases[ch] = (bases[ch] || 0) + 1;
    facts.counts = bases;
    const gc = ((bases.G || 0) + (bases.C || 0)) / s.length * 100;
    facts.gc_percent = Math.round(gc * 100) / 100;
  }
  return facts;
}

async function callOpenAICompatible(baseUrl, apiKey, model, system, user) {
  const r = await fetch(baseUrl + '/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + apiKey
    },
    body: JSON.stringify({
      model,
      temperature: 0.2,
      max_tokens: 1800,
      messages: [
        { role: 'system', content: system },
        { role: 'user', content: user }
      ]
    })
  });
  if (!r.ok) throw new Error(await r.text());
  const data = await r.json();
  return data.choices?.[0]?.message?.content || JSON.stringify(data);
}

async function callAnthropic(apiKey, system, user) {
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1800,
      temperature: 0.2,
      system,
      messages: [{ role: 'user', content: user }]
    })
  });
  if (!r.ok) throw new Error(await r.text());
  const data = await r.json();
  return data.content?.[0]?.text || JSON.stringify(data);
}

function buildPayload() {
  if (mode === 'sequence') {
    const seq = els.seq.value.trim();
    const facts = seqFacts(seq);
    const q = els.seq_q.value.trim() || 'What can be reliably said about this sequence?';
    return {
      facts,
      user: `Measured facts:\n${JSON.stringify(facts, null, 2)}\n\nQuestion: ${q}\n\nSequence (truncated):\n${cleanSeq(seq).slice(0, 3500)}`
    };
  }
  if (mode === 'variant') {
    const text = els.variant.value.trim();
    return {
      facts: { source: 'user text only' },
      user: `Variant description:\n${text}\n\nComment on possible molecular effect and what still needs external database checks.`
    };
  }
  return {
    facts: {},
    user: `Context:\n${els.ctx.value.trim()}\n\nQuestion:\n${els.free_q.value.trim()}`
  };
}

els.run.addEventListener('click', async () => {
  const openai = els.k_openai.value.trim();
  const anthropic = els.k_anthropic.value.trim();
  const xai = els.k_xai.value.trim();

  if (!openai && !anthropic && !xai) {
    els.status.innerHTML = '<span class="err">Add at least one API key.</span>';
    return;
  }

  const { facts, user } = buildPayload();
  els.facts.textContent = JSON.stringify(facts, null, 2);
  els.out_strict.textContent = '…';
  els.out_context.textContent = '…';
  els.out_skeptic.textContent = '…';
  els.run.disabled = true;
  els.status.textContent = 'Running…';

  const jobs = [];

  if (anthropic) {
    jobs.push(
      callAnthropic(anthropic, PROMPTS.strict, user)
        .then(t => { els.out_strict.textContent = t; })
        .catch(e => { els.out_strict.textContent = 'Error: ' + e.message; })
    );
  } else els.out_strict.textContent = 'No Anthropic key';

  if (openai) {
    jobs.push(
      callOpenAICompatible('https://api.openai.com/v1', openai, 'gpt-4o', PROMPTS.context, user)
        .then(t => { els.out_context.textContent = t; })
        .catch(e => { els.out_context.textContent = 'Error: ' + e.message; })
    );
  } else els.out_context.textContent = 'No OpenAI key';

  if (xai) {
    jobs.push(
      callOpenAICompatible('https://api.x.ai/v1', xai, 'grok-3', PROMPTS.skeptic, user)
        .then(t => { els.out_skeptic.textContent = t; })
        .catch(e => { els.out_skeptic.textContent = 'Error: ' + e.message; })
    );
  } else els.out_skeptic.textContent = 'No xAI key';

  await Promise.all(jobs);
  els.run.disabled = false;
  els.status.innerHTML = '<span class="ok">Done</span>';
});
</script>
</body>
</html>
