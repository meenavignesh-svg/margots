<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Margots — multi-agent molecular intelligence. Deterministic sequence facts, public literature, independent AI reasoning.">
<title>Margots — Multi-Agent Molecular Intelligence</title>
<style>
:root{
  --bg:#070b12;--panel:#0e1522;--text:#e8eef7;--muted:#8b9bb0;
  --line:rgba(56,189,248,.14);--cyan:#22d3ee;--blue:#3b82f6;--ok:#34d399;
  --strict:#22d3ee;--context:#a78bfa;--skeptic:#fb923c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
body{
  background:
    radial-gradient(ellipse 80% 50% at 50% -20%,rgba(34,211,238,.12),transparent 50%),
    radial-gradient(circle at 90% 80%,rgba(59,130,246,.08),transparent 40%),
    var(--bg);
}
.dna-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0;opacity:.14}
.dna{width:min(240px,38vw);height:min(380px,62vh);position:relative}
.dna .pair{position:absolute;left:50%;width:100%;height:12px;transform:translateX(-50%)}
.dna .base{position:absolute;top:50%;width:8px;height:8px;border-radius:50%;transform:translateY(-50%)}
.dna .base.a{background:rgba(34,211,238,.7)}
.dna .base.b{background:rgba(167,139,250,.65)}
.dna .rung{position:absolute;top:50%;height:1px;background:linear-gradient(90deg,rgba(34,211,238,.35),rgba(255,255,255,.1),rgba(167,139,250,.35));transform:translateY(-50%)}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(7,11,18,.88);backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;letter-spacing:.06em}
.brand .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#22d3ee,#3b82f6);box-shadow:0 0 18px rgba(34,211,238,.35)}
.status{font:600 11px/1 ui-monospace,Menlo,monospace;color:var(--ok);letter-spacing:.08em;display:flex;align-items:center;gap:7px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.icon{border:1px solid var(--line);background:rgba(14,21,34,.8);color:#b6c8dc;border-radius:10px;padding:7px 11px;font-size:12px;font-weight:600;cursor:pointer}
.icon:hover{border-color:rgba(34,211,238,.4);color:#fff}
.main{flex:1;min-height:0;width:min(880px,100%);margin:0 auto;display:flex;flex-direction:column;position:relative}
.chat{flex:1;overflow:auto;padding:28px 16px 150px;scrollbar-width:thin;scrollbar-color:rgba(56,189,248,.25) transparent}
.welcome{text-align:center;padding:10vh 14px 0}
.welcome h1{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:650;letter-spacing:-.03em;margin-bottom:8px}
.welcome p{color:var(--muted);font-size:15px;max-width:480px;margin:0 auto 22px;line-height:1.55}
.suggest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:1px solid var(--line);background:rgba(14,21,34,.7);color:#c5d4e6;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:550;cursor:pointer}
.chip:hover{border-color:var(--cyan);color:#fff;background:rgba(34,211,238,.08)}
.msg{display:flex;margin:12px 0;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{justify-content:flex-end}
.bubble{max-width:min(94%,680px);padding:13px 15px;border-radius:16px;background:rgba(14,21,34,.9);border:1px solid var(--line);white-space:pre-wrap;line-height:1.55;font-size:14.5px}
.user .bubble{background:rgba(34,211,238,.1);border-color:rgba(34,211,238,.28)}
.who{display:block;font:700 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;margin-bottom:7px;text-transform:uppercase}
.who.strict{color:var(--strict)}.who.context{color:var(--context)}.who.skeptic{color:var(--skeptic)}.who.local{color:var(--ok)}.who.system{color:var(--muted)}
.agents{display:grid;gap:10px;margin-top:4px}
@media(min-width:720px){.agents.cols-2{grid-template-columns:1fr 1fr}.agents.cols-3{grid-template-columns:1fr 1fr 1fr}}
.agent-card{padding:12px 13px;border-radius:14px;border:1px solid var(--line);background:rgba(7,11,18,.65);white-space:pre-wrap;line-height:1.5;font-size:13.5px}
.agent-card.strict{border-color:rgba(34,211,238,.35)}.agent-card.context{border-color:rgba(167,139,250,.35)}.agent-card.skeptic{border-color:rgba(251,146,60,.35)}
.facts{margin-top:4px;padding:12px;border-radius:12px;border:1px solid rgba(52,211,153,.25);background:rgba(52,211,153,.06);font-family:ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre-wrap;color:#c8f5e0}
.source{display:inline-block;margin:8px 8px 0 0;color:var(--cyan);font-size:12px}
.composer-wrap{position:absolute;left:12px;right:12px;bottom:16px}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px;background:rgba(14,21,34,.95);border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 48px rgba(0,0,0,.35)}
.composer textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:14.5px;padding:10px 6px;min-height:42px;max-height:120px}
.composer textarea::placeholder{color:#5f738a}
.composer button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(7,11,18,.8);color:#9ec9e0;cursor:pointer;font-size:15px}
.composer .send{border:0;background:linear-gradient(135deg,#22d3ee,#3b82f6);color:#041018;font-weight:700}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;align-items:flex-end;justify-content:center}
.drawer.open{display:flex}
.panel{width:min(640px,100%);max-height:82vh;overflow:auto;background:#0e1522;border:1px solid var(--line);border-radius:20px 20px 0 0;padding:20px;color:var(--text)}
.panel h2{font-size:1.15rem;margin-bottom:6px}.panel p{color:var(--muted);font-size:13px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;background:#070b12;color:var(--text)}
.primary{border:0;background:linear-gradient(135deg,#22d3ee,#3b82f6);color:#041018;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer}
.secondary{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:10px 16px;cursor:pointer}
.history-item{padding:12px;border:1px solid var(--line);border-radius:12px;margin:7px 0;cursor:pointer}
.history-item:hover{border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.05)}
@media(max-width:640px){.top{padding:0 10px}.brand{font-size:13px}.actions .icon{padding:6px 8px;font-size:11px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="dna-wrap" aria-hidden="true"><div class="dna" id="dna"></div></div>
<div class="app">
  <header class="top">
    <div class="brand"><span class="mark"></span> MARGOTS</div>
    <div class="status" id="status">READY</div>
    <div class="actions">
      <button class="icon" id="historyBtn" type="button">History</button>
      <button class="icon" id="keysBtn" type="button">API</button>
      <button class="icon" id="googleBtn" type="button">Google</button>
      <button class="icon" id="clearBtn" type="button">Clear</button>
    </div>
  </header>
  <main class="main">
    <section class="chat" id="chat">
      <div class="welcome" id="welcome">
        <h1>Molecular intelligence</h1>
        <p>Deterministic sequence facts first. Public literature from Europe PMC, OpenAlex, UniProt. Independent AI agents only for interpretation.</p>
        <div class="suggest">
          <button class="chip" type="button">Analyze a sequence</button>
          <button class="chip" type="button">Explain a biotech topic</button>
          <button class="chip" type="button">Analyze a file</button>
        </div>
      </div>
    </section>
    <div class="composer-wrap">
      <form class="composer" id="form">
        <button type="button" id="attach" title="Attach file">+</button>
        <textarea id="input" rows="1" placeholder="Paste DNA or ask a scientific question…"></textarea>
        <button type="button" id="mic" title="Voice">◉</button>
        <button class="send" type="submit" title="Send">↑</button>
      </form>
    </div>
  </main>
</div>
<div class="drawer" id="drawer"><div class="panel" id="panel"></div></div>
<input id="hiddenFile" type="file" hidden multiple>
<script src="bio-core.js"></script>
<script src="literature.js"></script>
<script src="google-search.js"></script>
<script src="unified-app.js"></script>
<script>
(function(){
  const dna=document.getElementById('dna'); if(!dna) return;
  for(let i=0;i<16;i++){
    const pair=document.createElement('div'); pair.className='pair';
    const t=i/15, twist=t*Math.PI*3.0, spread=38+Math.sin(twist)*10;
    pair.style.top=(t*100)+'%';
    pair.innerHTML='<span class="base a" style="left:calc(50% - '+spread+'px)"></span><span class="rung" style="left:calc(50% - '+(spread-5)+'px);right:calc(50% - '+(spread-5)+'px)"></span><span class="base b" style="right:calc(50% - '+spread+'px)"></span>';
    dna.appendChild(pair);
  }
})();
document.getElementById('googleBtn').onclick=()=>window.MargotsGoogleSearch?.configure();
</script>
</body>
</html>
