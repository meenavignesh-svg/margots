<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Margots</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"Space Grotesk",Inter,system-ui,-apple-system,sans-serif;background:#0b0b0c;color:#e8e8e6;overflow:hidden}

/* transparent DNA helix — center, subtle */
.dna-wrap{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:0;opacity:.22;
}
.dna{
  width:min(280px,42vw);height:min(420px,70vh);position:relative;
  transform-style:preserve-3d;
}
.dna .pair{
  position:absolute;left:50%;width:100%;height:14px;
  transform:translateX(-50%);
}
.dna .base{
  position:absolute;top:50%;width:10px;height:10px;border-radius:50%;
  transform:translateY(-50%);
}
.dna .base.a{left:0;background:rgba(244,62,1,.55)}
.dna .base.b{right:0;background:rgba(56,189,248,.5)}
.dna .rung{
  position:absolute;left:10px;right:10px;top:50%;height:1.5px;
  background:linear-gradient(90deg,rgba(244,62,1,.35),rgba(255,255,255,.12),rgba(56,189,248,.35));
  transform:translateY(-50%);
}

.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

/* top bar — Groq-like minimal */
.top{
  height:56px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;border-bottom:1px solid rgba(255,255,255,.06);
  background:rgba(11,11,12,.85);backdrop-filter:blur(12px);
}
.brand{
  font-weight:500;font-size:15px;letter-spacing:.04em;color:#f3f3ee;
  display:flex;align-items:center;gap:10px;
}
.brand .mark{
  width:22px;height:22px;border-radius:6px;
  background:#f43e01;
}
.status{
  font:500 11px/1 "IBM Plex Mono",ui-monospace,monospace;
  color:#9c9c90;letter-spacing:.08em;text-transform:uppercase;
}
.actions{display:flex;gap:6px}
.icon{
  border:1px solid rgba(255,255,255,.1);background:transparent;color:#c8c8c0;
  border-radius:999px;padding:7px 12px;font-size:12px;font-weight:500;cursor:pointer;
}
.icon:hover{border-color:rgba(255,255,255,.2);color:#fff}

.main{
  flex:1;min-height:0;width:min(760px,100%);margin:0 auto;
  display:flex;flex-direction:column;position:relative;
}
.chat{
  flex:1;overflow:auto;padding:32px 16px 140px;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent;
}

.welcome{text-align:center;padding:12vh 12px 0}
.welcome h1{
  font-weight:300;font-size:clamp(28px,4vw,40px);letter-spacing:-.03em;
  color:#f3f3ee;margin-bottom:10px;
}
.welcome p{color:#9c9c90;font-size:15px;max-width:420px;margin:0 auto 28px;line-height:1.5}
.suggest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);
  color:#c8c8c0;border-radius:999px;padding:9px 14px;font-size:13px;cursor:pointer;
}
.chip:hover{border-color:rgba(244,62,1,.45);color:#fff}

.msg{display:flex;margin:14px 0}
.msg.user{justify-content:flex-end}
.bubble{
  max-width:min(92%,640px);padding:14px 16px;border-radius:16px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);
  white-space:pre-wrap;line-height:1.55;font-size:15px;color:#e8e8e6;
}
.user .bubble{
  background:rgba(244,62,1,.12);border-color:rgba(244,62,1,.25);
}
.who{
  display:block;font:500 10px/1 "IBM Plex Mono",ui-monospace,monospace;
  color:#9c9c90;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;
}
.source{display:inline-block;margin:10px 8px 0 0;color:#f43e01;font-size:12px;text-decoration:none}

.composer-wrap{position:absolute;left:12px;right:12px;bottom:18px}
.composer{
  display:flex;gap:8px;align-items:flex-end;padding:10px 12px;
  background:#141416;border:1px solid rgba(255,255,255,.1);border-radius:18px;
}
.composer textarea{
  flex:1;resize:none;border:0;outline:0;background:transparent;
  color:#f3f3ee;font:inherit;font-size:15px;padding:8px 4px;
  min-height:40px;max-height:120px;
}
.composer textarea::placeholder{color:#69695d}
.composer button{
  width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.1);
  background:transparent;color:#c8c8c0;cursor:pointer;font-size:15px;
}
.composer .send{
  border:0;background:#f43e01;color:#fff;font-weight:600;
}
.composer .send:hover{filter:brightness(1.08)}

.drawer{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;
  display:none;align-items:flex-end;justify-content:center;
}
.drawer.open{display:flex}
.panel{
  width:min(640px,100%);max-height:80vh;overflow:auto;
  background:#141416;border:1px solid rgba(255,255,255,.1);
  border-radius:20px 20px 0 0;padding:22px;color:#e8e8e6;
}
.panel h2{font-weight:500;margin-bottom:6px}
.panel p{color:#9c9c90;font-size:13px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row input{
  flex:1;border:1px solid rgba(255,255,255,.12);border-radius:10px;
  padding:10px;background:#0b0b0c;color:#e8e8e6;
}
.primary{
  border:0;background:#f43e01;color:#fff;border-radius:999px;
  padding:10px 16px;font-weight:600;cursor:pointer;
}
.secondary{
  border:1px solid rgba(255,255,255,.12);background:transparent;color:#c8c8c0;
  border-radius:999px;padding:10px 16px;cursor:pointer;
}
.history-item{
  padding:12px;border:1px solid rgba(255,255,255,.08);border-radius:12px;
  margin:7px 0;cursor:pointer;background:rgba(255,255,255,.02);
}
.history-item:hover{border-color:rgba(244,62,1,.35)}

@media(max-width:640px){
  .top{padding:0 12px}
  .brand{font-size:14px}
  .dna{opacity:.9}
}

/* MARGOTS_PREMIUM_LIGHT_UI */
:root{--bg0:#ffffff;--bg1:#f7f7f8;--text:#171717;--muted:#6b7280;--cyan:#10a37f;--blue:#0d9488;--violet:#64748b;--line:#e5e7eb;--glass:#ffffff;--ok:#10a37f}
html,body{background:#fff!important;color:#171717!important}
body{background-image:none!important}
body::before,.ambient{display:none!important}
.top{height:60px!important;background:rgba(255,255,255,.94)!important;border-bottom:1px solid #e5e7eb!important;backdrop-filter:blur(14px)!important}
.brand{letter-spacing:.02em!important;color:#171717!important}
.brand .logo{background:linear-gradient(135deg,#10a37f,#0ea5e9)!important;box-shadow:0 4px 16px rgba(16,163,127,.18)!important}
.icon{background:#fff!important;color:#404040!important;border-color:#e5e7eb!important;box-shadow:none!important}
.main{width:min(860px,100%)!important}
.chat{scrollbar-color:#d1d5db transparent!important}
.core{width:72px!important;height:72px!important;margin-bottom:20px!important;background:linear-gradient(135deg,#10a37f,#0ea5e9)!important;box-shadow:0 10px 28px rgba(16,163,127,.18)!important}
.core::before,.core::after{border-color:rgba(16,163,127,.18)!important}
.welcome h1{color:#171717!important;text-shadow:none!important;font-weight:650!important}
.welcome p{color:#6b7280!important}
.chip{background:#fff!important;color:#404040!important;border-color:#e5e7eb!important}
.chip:hover{background:#f7f7f8!important;border-color:#cfd4d9!important;transform:none!important}
.bubble{background:#f7f7f8!important;color:#171717!important;border:0!important;box-shadow:none!important;backdrop-filter:none!important;border-radius:18px!important}
.user .bubble{background:#eef7f4!important;border:0!important}
.who{color:#6b7280!important}
.source{color:#0b7f66!important}
.composer-wrap{left:0!important;right:0!important;bottom:16px!important}
.composer{background:#fff!important;border:1px solid #d1d5db!important;border-radius:18px!important;box-shadow:0 8px 30px rgba(0,0,0,.08)!important;backdrop-filter:none!important}
.composer textarea{color:#171717!important}.composer textarea::placeholder{color:#9ca3af!important}
.composer button{background:#f3f4f6!important;color:#374151!important;border-color:#e5e7eb!important}.composer .send{background:#111827!important;color:#fff!important}
.panel{background:#fff!important;color:#171717!important;border-color:#e5e7eb!important;box-shadow:0 -20px 60px rgba(0,0,0,.12)!important}.panel p{color:#6b7280!important}.row input{background:#fff!important;color:#171717!important;border-color:#d1d5db!important}.secondary{color:#374151!important;background:#fff!important;border-color:#d1d5db!important}
.human{right:-18px!important;opacity:.16!important;transform:scale(.78)!important;transform-origin:bottom right!important;filter:grayscale(.2)!important}.human.active,.human.talk{opacity:.24!important}
@media(max-width:900px){.human{display:none!important}}
</style>
  <link rel="stylesheet" href="chatgpt-layout.css">
</head>
<body>

<div class="dna-wrap" aria-hidden="true">
  <div class="dna" id="dna"></div>
</div>

<div class="app">
  <header class="top">
    <div class="brand"><span class="mark"></span> MARGOTS</div>
    <div class="status" id="status">Ready</div>
    <div class="actions">
      <button class="icon" id="historyBtn">History</button>
      <button class="icon" id="keysBtn">API</button>
      <button class="icon" id="googleBtn">Google</button>
      <button class="icon" id="clearBtn">Clear</button>
    </div>
  </header>

  <main class="main">
    <section class="chat" id="chat">
      <div class="welcome" id="welcome">
        <h1>How can I help?</h1>
        <p>Research, sequences, files, search, and analysis — one clean conversation.</p>
        <div class="suggest">
          <button class="chip">Analyze a sequence</button>
          <button class="chip">Explain a biotech topic</button>
          <button class="chip">Analyze a file</button>
        </div>
      </div>
    </section>

    <div class="composer-wrap">
      <form class="composer" id="form">
        <button type="button" id="attach" title="Attach">+</button>
        <textarea id="input" rows="1" placeholder="Ask Margots…"></textarea>
        <button type="button" id="mic" title="Voice">◉</button>
        <button class="send" title="Send">↑</button>
      </form>
    </div>
  </main>
</div>

<div class="drawer" id="drawer"><div class="panel" id="panel"></div></div>
<input id="hiddenFile" type="file" hidden multiple>

<script src="google-search.js"></script>
<script src="unified-app.js"></script>
<script>
/* static transparent DNA — no avatar, no motion gimmicks */
(function(){
  const dna = document.getElementById('dna');
  const N = 18;
  for (let i = 0; i < N; i++) {
    const pair = document.createElement('div');
    pair.className = 'pair';
    const t = i / (N - 1);
    const y = t * 100;
    const twist = t * Math.PI * 3.2;
    const spread = 42 + Math.sin(twist) * 8;
    pair.style.top = y + '%';
    pair.innerHTML =
      '<span class="base a" style="left:calc(50% - ' + spread + 'px)"></span>' +
      '<span class="rung" style="left:calc(50% - ' + (spread - 6) + 'px);right:calc(50% - ' + (spread - 6) + 'px)"></span>' +
      '<span class="base b" style="right:calc(50% - ' + spread + 'px)"></span>';
    dna.appendChild(pair);
  }
})();
document.getElementById('googleBtn').onclick = () => window.MargotsGoogleSearch?.configure();
</script>
</body>
</html>
