<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Margots — Unified Scientific Intelligence</title><style>html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#10233b;background:radial-gradient(circle at 50% 5%,#dff7ff,transparent 30%),linear-gradient(#fbfdff,#f3f8fc)}*{box-sizing:border-box}.app{height:100%;display:flex;flex-direction:column}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#ffffffb8;backdrop-filter:blur(18px);border-bottom:1px solid #d9eaf4;z-index:5}.brand{font-weight:850;letter-spacing:.14em}.status{font:700 11px ui-monospace;color:#0891b2}.main{width:min(900px,100%);margin:auto;flex:1;display:flex;min-height:0;position:relative}.chat{flex:1;overflow:auto;padding:25px 16px 140px}.welcome{text-align:center;padding:8vh 10px}.core{width:105px;height:105px;margin:auto auto 20px;border-radius:50%;background:radial-gradient(circle at 30% 20%,#fff,#a5f3fc 28%,#38bdf8 55%,#2563eb);box-shadow:0 18px 50px #2563eb30;animation:float 4s ease-in-out infinite}.msg{display:flex;margin:12px 0}.msg.user{justify-content:flex-end}.bubble{max-width:90%;padding:13px 16px;border-radius:18px;background:#ffffffd9;border:1px solid #d9eaf4;box-shadow:0 8px 24px #0f172a0b;white-space:pre-wrap}.user .bubble{background:linear-gradient(135deg,#e0f7ff,#e8efff)}.who{display:block;color:#0891b2;font:800 10px ui-monospace;margin-bottom:5px}.composer-wrap{position:absolute;left:12px;right:12px;bottom:15px}.composer{display:flex;gap:7px;padding:8px;background:#ffffffdf;backdrop-filter:blur(20px);border:1px solid #bae6fd;border-radius:22px;box-shadow:0 18px 55px #1f4e791c}.composer textarea{flex:1;resize:none;border:0;outline:0;background:transparent;padding:11px;min-height:42px;max-height:130px}.composer button{width:44px;height:44px;border-radius:14px;border:1px solid #d9eaf4;background:#f0f9ff;color:#0369a1}.composer .send{border:0;background:linear-gradient(135deg,#06b6d4,#2563eb);color:white}.human{position:fixed;right:22px;bottom:115px;width:210px;height:305px;z-index:6;pointer-events:none;animation:floatHuman 4.8s ease-in-out infinite;transform-origin:50% 100%;transition:transform .5s ease,filter .5s ease}.human.active{animation:think 1.4s ease-in-out infinite}.human.talk{animation:talkBody .65s ease-in-out infinite}.halo{position:absolute;left:10px;top:15px;width:190px;height:260px;border:1px solid #22d3ee55;border-radius:50%;transform:rotateY(65deg) rotateZ(-7deg);animation:halo 9s linear infinite}.hair{position:absolute;left:58px;top:18px;width:96px;height:104px;border-radius:48% 48% 42% 42%;background:linear-gradient(145deg,#334e68,#071a2d);box-shadow:inset 12px 0 14px #ffffff12;animation:hairMove 3s ease-in-out infinite}.face{position:absolute;left:66px;top:47px;width:80px;height:98px;border-radius:44% 44% 48% 48%;background:linear-gradient(145deg,#ffe9d2,#e9b28e);box-shadow:inset -10px -5px 15px #783c1e1f;animation:look 5s ease-in-out infinite}.neck{position:absolute;left:88px;top:130px;width:38px;height:48px;background:#e7ad86;border-radius:10px}.body{position:absolute;left:38px;top:160px;width:134px;height:112px;border-radius:48px 48px 18px 18px;background:linear-gradient(135deg,#fff,#eaf7fb 48%,#b8e8f5);border:1px solid #0ea5e940;box-shadow:inset -18px -10px 25px #0284c71a}.collar{position:absolute;left:82px;top:165px;width:46px;height:52px;background:#eefcff;clip-path:polygon(0 0,50% 50%,100% 0,80% 100%,20% 100%)}.eye{position:absolute;top:91px;width:8px;height:5px;border-radius:50%;background:#18344d;z-index:2;animation:blink 5s infinite}.eye.l{left:88px}.eye.r{left:120px}.mouth{position:absolute;left:99px;top:122px;width:17px;height:7px;border-bottom:2px solid #73362a99;border-radius:50%;animation:mouth 1.1s ease-in-out infinite}.hand{position:absolute;width:38px;height:82px;border-radius:22px;background:linear-gradient(145deg,#ffe9d2,#dfa47d);top:176px;z-index:-1}.hand.l{left:18px;transform:rotate(22deg);animation:gestureL 3.2s ease-in-out infinite}.hand.r{right:18px;transform:rotate(-22deg);animation:gestureR 4s ease-in-out infinite}.badge{position:absolute;right:0;bottom:20px;padding:4px 7px;border-radius:8px;background:#ffffffd9;border:1px solid #bae6fd;color:#0369a1;font:700 8px ui-monospace;letter-spacing:.1em}@keyframes float{50%{transform:translateY(-8px)}}@keyframes floatHuman{0%,100%{transform:translate3d(0,0,0) rotateY(0)}50%{transform:translate3d(0,-9px,0) rotateY(4deg)}}@keyframes halo{to{transform:rotateY(65deg) rotateZ(353deg)}}@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.08)}}@keyframes mouth{0%,100%{transform:scaleX(.7)}50%{transform:scaleX(1.2)}}@keyframes hairMove{50%{transform:translateX(2px) rotate(1deg)}}@keyframes look{0%,100%{transform:rotateY(0)}50%{transform:rotateY(-5deg)}}@keyframes gestureL{0%,100%{transform:rotate(22deg) translateY(0)}50%{transform:rotate(5deg) translateY(-18px)}}@keyframes gestureR{0%,100%{transform:rotate(-22deg) translateY(0)}50%{transform:rotate(-42deg) translateY(-9px)}}@keyframes talkBody{50%{transform:translateY(-3px) scale(1.01)}}@keyframes think{0%,100%{transform:translateY(0) rotateY(0)}50%{transform:translateY(-6px) rotateY(-7deg)}}@media(max-width:760px){.human{right:2px;bottom:105px;transform:scale(.58);transform-origin:bottom right;opacity:.9}.top{padding:0 12px}} </style></head><body><div class="app"><div class="human" id="human" aria-label="Animated Margots assistant"><div class="halo"></div><div class="hair"></div><div class="face"></div><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div><div class="neck"></div><div class="body"></div><div class="collar"></div><div class="hand l"></div><div class="hand r"></div><div class="badge">MARGOTS AI</div></div><header class="top"><div class="brand">🧬 MARGOTS</div><div class="status" id="status">● READY</div></header><main class="main"><section class="chat" id="chat"><div class="welcome" id="welcome"><div class="core"></div><h1>How can I help?</h1><p>One conversation for research, sequences, files, web search, AI analysis and everything else.</p></div></section><div class="composer-wrap"><form class="composer" id="form"><button type="button" id="attach">📎</button><textarea id="input" rows="1" placeholder="Ask Margots anything…"></textarea><button type="button" id="mic">🎙</button><button class="send">➤</button></form></div></main></div><input id="hiddenFile" type="file" hidden multiple><script src="unified-app.js"></script><script>const h=document.getElementById('human'),st=document.getElementById('status');document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement===document.getElementById('input')){h.classList.add('talk');setTimeout(()=>h.classList.remove('talk'),900)}});document.getElementById('input').addEventListener('input',()=>{h.classList.add('active');clearTimeout(window.mh);window.mh=setTimeout(()=>h.classList.remove('active'),1000)});setInterval(()=>{if(Math.random()<.25){h.classList.add('active');setTimeout(()=>h.classList.remove('active'),1000)}},5000);new MutationObserver(()=>{if(st.textContent.includes('SEARCH')||st.textContent.includes('THINK'))h.classList.add('active');else if(st.textContent.includes('READY'))h.classList.remove('active')}).observe(st,{childList:true,subtree:true,characterData:true});</script></body></html>
