services:
  - type: web
    name: margots-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend:app --bind 0.0.0.0:$PORT --workers 2 --timeout 90
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: REQUIRE_AI
        value: "1"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT_DEFAULT
        value: 120 per minute
      - key: ANALYZE_RATE_LIMIT
        value: 30 per minute
      - key: SEARCH_RATE_LIMIT
        value: 20 per minute
      - key: RATELIMIT_STORAGE_URI
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_CLOUD_URL
        value: https://ollama.com
      - key: OLLAMA_CLOUD_MODEL
        value: gpt-oss:20b
      - key: OLLAMA_ENABLED
        value: "1"
      - key: OLLAMA_BASE_URL
        value: http://127.0.0.1:11434
      - key: OLLAMA_MODEL
        value: qwen2.5:1.5b
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        sync: false
