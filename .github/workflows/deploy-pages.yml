name: Deploy Margots to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Configure production API URL
        env:
          MARGOTS_API_BASE_URL: ${{ vars.MARGOTS_API_BASE_URL }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path('docs/config.js')
          text = path.read_text(encoding='utf-8')
          url = os.environ.get('MARGOTS_API_BASE_URL', '').strip().rstrip('/')
          if not url:
              url = 'https://margots-api.onrender.com'
          text = text.replace('API_BASE_URL: ""', 'API_BASE_URL: ' + repr(url))
          path.write_text(text, encoding='utf-8')
          PY

      - name: Upload docs site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
