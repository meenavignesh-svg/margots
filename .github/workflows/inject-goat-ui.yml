name: Inject Margots GOAT UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure GOAT UI scripts are loaded
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text(encoding='utf-8')
          markers = [
              '<script src="goat-ui.js"></script>',
              '<script src="jarvis-search-first.js"></script>'
          ]
          needle = '<script src="app.js"></script>'
          if needle not in s:
              raise SystemExit('Expected app.js script tag was not found; refusing to modify index.html')
          for marker in markers:
              if marker not in s:
                  s = s.replace(needle, needle + '\n' + marker, 1)
                  needle = marker
          p.write_text(s, encoding='utf-8')

      - name: Commit injected loaders
        run: |
          if git diff --quiet -- docs/index.html; then
            echo 'No index change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git commit -m 'Load GOAT and search-first JARVIS layers'
          git push
